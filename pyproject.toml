[project]
name = "ds-prep"
version = "0.1.0"
description = "Study code for DS/ML interview prep"
readme = "README.md"
authors = [
    { name = "Sourav Jain", email = "souravjain122@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "pandas>=3.1.1",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[project]
name = "ds-prep"
version = "0.1.0"
description = "Study code for DS/ML interview prep"
readme = "README.md"
authors = [
    { name = "Sourav Jain", email = "souravjain122@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "polars>=2.2.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "ANN", "PL", "PT", "LOG", "G", "TRY"]
ignore = ["PLR2004", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[project.scripts]
ds-prep = "ds_prep.cli:main"
